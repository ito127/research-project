name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    # CPU only: the tests need no GPU and no model weights.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        # Same order as scripts/setup_env.sh, with the CPU build of PyTorch.
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "torch==2.7.1" "torchvision==0.22.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install ./diffusers

      - name: Check syntax
        run: |
          python -m compileall -q textremoval scripts eval models tests
          for script in scripts/*.sh eval/*.sh; do bash -n "$script"; done

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
